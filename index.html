<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#07060b;--pr:255,42,109;--p2:#d6003f;--p3:#a80040;--p4:#ff5c91;--sf:#0b0a10;--sf2:#17151f;--nv:18,16,26;--c:rgba(255,255,255,.07);--b:rgba(255,255,255,.11);--p:#ff2a6d;--g:#34e07a;--y:#ffc93c;--m:#8b8aa0;--t:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{color:var(--t);font:400 15px 'Exo 2',system-ui,sans-serif;background:radial-gradient(ellipse at 80% 20%,rgba(var(--pr),.18),transparent 55%),radial-gradient(ellipse at 10% 70%,rgba(var(--pr),.1),transparent 50%),var(--bg);min-height:100vh}
#app{max-width:430px;margin:auto;padding:14px 14px 120px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:14px}.hd h1{font-size:26px;font-weight:800;line-height:1}.hd small{color:var(--m);font-size:13px}.hd .t{flex:1;margin-left:4px}
.ib{width:42px;height:42px;border-radius:14px;background:var(--c);border:1px solid var(--b);display:grid;place-items:center;font-size:17px}
.card{background:var(--c);border:1px solid var(--b);border-radius:22px;padding:14px;margin-bottom:12px;backdrop-filter:blur(8px)}
.row{display:flex;align-items:center;gap:12px}.f1{flex:1;min-width:0}.mut{color:var(--m)}.sm{font-size:13px}

/* ===== GLASSMORPHISM v2 ===== */
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 82% 80%,rgba(255,190,70,.14),transparent 38%),radial-gradient(circle at 6% 55%,rgba(110,70,255,.2),transparent 42%),radial-gradient(circle at 70% 8%,rgba(40,190,255,.12),transparent 36%)}
/* градиентная "светящаяся" кромка: ярко сверху-слева, мягко снизу-справа */
.card,.ib,.pr,.opt:not(.on),.tabs,.bk,.empty{border:1px solid transparent;background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.2),rgba(255,255,255,0) 55%) padding-box,linear-gradient(135deg,rgba(255,255,255,.11),rgba(255,255,255,.03) 50%,rgba(255,255,255,.07)) padding-box,linear-gradient(140deg,rgba(255,255,255,.6),rgba(255,255,255,.07) 35%,rgba(255,255,255,.02) 65%,rgba(255,255,255,.3)) border-box;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 20px rgba(255,255,255,.05),0 6px 18px rgba(0,0,0,.25)}
.tabs{border-radius:22px;padding:4px}
.bk{border-radius:16px;display:inline-flex;align-items:center;gap:4px;padding:8px 14px 8px 8px}
.empty{border-radius:24px;padding:28px 16px}
.nav>div{border:1px solid transparent;background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.2),rgba(255,255,255,0) 55%) padding-box,linear-gradient(rgba(var(--nv),.5),rgba(var(--nv),.5)) padding-box,linear-gradient(140deg,rgba(255,255,255,.65),rgba(255,255,255,.08) 35%,rgba(255,255,255,.03) 65%,rgba(255,255,255,.35)) border-box}
#toast{background:rgba(26,24,34,.55)!important;-webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);border:1px solid rgba(255,255,255,.2)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 28px rgba(0,0,0,.4)!important}
.sh>div{-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);border-top:1px solid rgba(255,255,255,.28);border-left:1px solid rgba(255,255,255,.1);border-right:1px solid rgba(255,255,255,.1)}
html[data-gl=max] :is(.card,.ib,.pr,.opt,.tabs,.pill,.cat,.bk,.empty,.ok,.live){-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5)}
html[data-gl=max] :is(.card,.pr,.cat,.tabs,.empty,.sh>div) :is(.card,.pill,.opt,.ib,.tabs,.pr,.cat,.ok,.live){-webkit-backdrop-filter:none;backdrop-filter:none}
html[data-gl=lite] :is(.card,.ib,.pr,.opt,.tabs,.pill,.cat,.bk,.empty){-webkit-backdrop-filter:none;backdrop-filter:none}
@media(prefers-reduced-transparency:reduce){#toast,.sh>div,.nav>div{-webkit-backdrop-filter:none;backdrop-filter:none}}
/* ===== PERF: легче GPU, адаптивное стекло ===== */
body::after{display:none}
body::before{background:radial-gradient(circle at 18% 12%,rgba(var(--pr),.34),transparent 42%),radial-gradient(circle at 90% 42%,rgba(130,90,255,.26),transparent 44%),radial-gradient(circle at 25% 90%,rgba(40,190,255,.16),transparent 46%),radial-gradient(circle at 82% 80%,rgba(255,190,70,.14),transparent 38%),radial-gradient(circle at 6% 55%,rgba(110,70,255,.2),transparent 42%)}
html[data-gl=max] :is(.card,.ib,.pr,.opt,.tabs,.pill,.cat,.bk,.empty,.ok,.live){-webkit-backdrop-filter:none;backdrop-filter:none}
html[data-gl=max] :is(.card,.ib,.tabs,.bk,.empty){-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.nav>div{-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4)}
.sh>div{-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5)}
html[data-ent] #app *,html[data-sc] #app *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
html[data-gl=max] .grid>.card{-webkit-backdrop-filter:none;backdrop-filter:none}
/* ===== React Three Fiber: 3D-значок ранга ===== */
.hx.r3{clip-path:none;background:none!important;color:transparent;font-size:0!important;position:relative;overflow:visible}
.r3d{position:absolute;inset:-24%;pointer-events:none}.r3d canvas{display:block}

/* ===== AUTH: вход и регистрация ===== */
#au{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse at 15% 92%,rgba(var(--pr),.2),transparent 55%),radial-gradient(ellipse at 88% 22%,rgba(var(--pr),.12),transparent 50%),var(--bg)}
#au[hidden]{display:none}
.au-w{width:100%;max-width:460px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.au-in{flex:1;display:flex;flex-direction:column;animation:auin .38s cubic-bezier(.2,.9,.3,1)}
@keyframes auin{from{opacity:0;transform:translateX(var(--dx,0))}}
.au-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.au-back{width:56px;height:56px;border-radius:20px;flex:none}
.au-dots{flex:1;display:flex;justify-content:center;gap:10px;margin-right:56px}
.au-dots i{width:10px;height:10px;border-radius:5px;background:rgba(255,255,255,.14);transition:width .3s}
.au-dots i.p{background:var(--p)}.au-dots i.on{width:36px;background:var(--p)}
.au-h{font-size:30px;font-weight:800;line-height:1.15;margin:28px 0 8px}
.au-s{color:var(--m);font-size:16px;line-height:1.4;margin-bottom:26px}
.au-lb{display:block;color:var(--p);font-weight:800;font-size:13px;letter-spacing:.2em;margin:0 0 10px 2px}
.au-f{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 18px;margin-bottom:10px;border-radius:26px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);transition:border-color .2s,box-shadow .2s}
.au-f:focus-within{border-color:var(--p);box-shadow:0 0 0 1px rgba(var(--pr),.25),0 0 22px rgba(var(--pr),.28)}
.au-f.bad{border-color:#ff3355;animation:aushake .35s}
@keyframes aushake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.au-f input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-weight:600;padding:0;min-height:44px}
.au-f input::placeholder{color:var(--m);opacity:.6;font-weight:400}
.au-fi{color:var(--p);display:grid;place-items:center;flex:none}.au-fi svg.i{width:22px;height:22px;vertical-align:0}
.au-eye{color:var(--m);width:44px;height:44px;display:grid;place-items:center;margin-right:-10px}.au-eye svg.i{width:22px;height:22px;vertical-align:0}
.au-er.ban{background:rgba(255,42,60,.12);border:1px solid #7a1736;border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.4;color:#ff7a8e}
.au-er{white-space:pre-line;min-height:22px;color:#ff5a78;font-size:14px;font-weight:600;margin:0 4px 8px}

.au-o{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:14px 18px;margin-bottom:12px;border-radius:26px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);text-align:left;cursor:pointer}

.au-b{min-width:56px;height:44px;padding:0 14px;border-radius:22px;background:rgba(255,255,255,.07);color:var(--m);font-weight:800;font-size:13px;letter-spacing:.06em;display:grid;place-items:center;flex:none}
.au-b svg.i{width:24px;height:24px;vertical-align:0}.au-b.sq{width:56px;height:56px;border-radius:28px;padding:0}

.au-c{margin-left:auto;color:var(--p);opacity:0;flex:none}.au-c svg.i{width:22px;height:22px;vertical-align:0}.au-o.on .au-c{opacity:1}

.au-pv{width:112px;height:112px;border-radius:50%;margin:0 auto 18px;border:2px solid var(--p);background:#0d0c12 center/cover no-repeat;box-shadow:0 0 24px rgba(var(--pr),.35)}

.au-logo{width:150px;height:auto;filter:drop-shadow(0 0 28px rgba(var(--pr),.35));margin-bottom:26px}
.au-cf{font-size:clamp(34px,11vw,46px);font-weight:800;letter-spacing:.3em;padding-left:.3em;line-height:1.1}
.au-rk{font-size:clamp(34px,11vw,46px);font-weight:800;letter-spacing:.3em;padding-left:.3em;line-height:1.15;background:linear-gradient(90deg,var(--p),var(--p4));-webkit-background-clip:text;background-clip:text;color:transparent}

@media(prefers-reduced-motion:reduce){.au-in,.au-f.bad{animation:none}}

@media(min-width:1100px){
